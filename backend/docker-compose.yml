# LipScribe demo backend on Coolify (the Alienware). Coolify: "Docker Compose" build pack,
# base directory "/", compose file "/backend/docker-compose.yml" (DEPLOYMENT.md, step 5).
#
# Also runs by hand on the Alienware, from the repository root:
#   docker compose -f backend/docker-compose.yml up -d --build
services:
  backend:
    build:
      context: ..                    # the repository root (the backend imports lipscribe/ and scripts/)
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "8800"                       # reached through Coolify's proxy only; no port opened on the host
    environment:
      - DEMO_CODE=${DEMO_CODE:-}
      - DEMO_MODELS=${DEMO_MODELS:-any,grid}
      - DEMO_ORIGINS=${DEMO_ORIGINS:-*}
    # The models, the LM and the face landmarker live on the Alienware, in one folder laid out like
    # the repository (DEPLOYMENT.md, step 3). Read-only: the container never changes them.
    # The host paths are written out in full on purpose: Coolify splits each volume line on ":",
    # so a variable with a default value here breaks the deployment ("invalid spec ... empty
    # section between colons"). To use another folder, change /srv/lipscribe/assets on all lines.
    volumes:
      - /srv/lipscribe/assets/checkpoints:/app/checkpoints:ro
      - /srv/lipscribe/assets/runs:/app/runs:ro
      - /srv/lipscribe/assets/lm:/app/lm:ro
      - /srv/lipscribe/assets/models:/app/models:ro
      - /srv/lipscribe/assets/pretrained:/app/pretrained:ro
      - /srv/lipscribe/assets/data/stats:/app/data/stats:ro
      - /srv/lipscribe/assets/Data:/app/Data:ro
    # The GPU (needs the NVIDIA Container Toolkit on the Alienware; DEPLOYMENT.md, step 1).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"
