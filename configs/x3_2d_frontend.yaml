# Ablation X3: P4 (p_init_b1_b2_v2) with a per-frame 2D front end instead of the 3D one.
# One change: model.frontend 3d (Conv3d 5x7x7) -> 2d (Conv3d 1x7x7, no temporal kernel).
# B2 init loads the 3D front-end weight by summing over time. Why: isolates the contribution of the 3D front end.
experiment: x3_2d_frontend
seed: 1
data:
  manifest: data/manifest.csv
  splits: data/splits.csv
  feature_stats: data/stats/feature_norm.npz
  noise_splits: Data/Noise_splits/splits.csv
  noisy_dir: data/processed/noisy_test
  visual_augment: true
  visual_aug:
    max_jitter: 4
    p_flip: 0.5
    max_scale: 0.1
    p_erase: 0.5
    max_erase_area: 0.15
    time_masks: 2
    max_mask_width: 6
  train_snrs: [clean, 10, 5, 0, -5]
  eval_snrs:  [clean, 10, 5, 0, -5]
model:
  name: p_proposed
  streams: [audio, visual]
  audio_features: logmel80
  visual_encoder: resnet18_bilstm
  frontend: 2d
  input_norm: clip
  spatial_dropout: 0.2
  fusion: cross_attention_gated
  dropout: 0.3
  attn_dropout: 0.1
  num_heads: 4
  modality_dropout: {audio: 0.25, visual: 0.15}
  init_audio_from: checkpoints/b1_audio_only_best.pt
  init_visual_from: checkpoints/b2_visual_only_v2_best.pt
train:
  optimiser: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-2
  batch_size: 16
  grad_accum: 1
  max_epochs: 40
  warmup_epochs: 1
  patience: 12
  grad_clip: 5.0
  amp: true
  num_workers: 8
decode: {method: greedy}
