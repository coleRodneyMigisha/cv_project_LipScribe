# Flix v4 stage 2: visual-only (lip-reading) model. Auto-AVSR vsr_trlrs3vox2_base front-end +
# Conformer encoder (decoder and subword CTC dropped) fine-tuned with a character CTC head on
# film + TED mouth crops (data/flix_v3). Target: WER < 30 %. See reports/flix_v4/decision_log.md.
experiment: flix_v4_visual
seed: 1
data:
  manifest: data/flix_v3/train_mix.csv
  splits: data/flix_v3/splits.csv
  noise_splits: Data/Noise_splits/splits.csv
  val_manifests: {film: data/flix_v3/film_val.csv, ted: data/flix_v3/ted_val.csv}
  visual_augment: true
  visual_aug: {max_jitter: 4, p_flip: 0.5, max_scale: 0.1, p_erase: 0.3, max_erase_area: 0.15,
               time_masks: 2, max_mask_width: 6}
  train_snrs: [clean]        # audio is not used by this model
  eval_snrs: [clean]
model:
  name: v4_visual
  dropout: 0.1
  visual_encoder_cfg: {checkpoint: pretrained/vsr_trlrs3vox2_base.pth, dropout: 0.1}
train:
  optimiser: adamw
  lr: 5.0e-4                 # CTC head
  lr_mult: {visual_encoder: 0.1}  # pretrained encoder at 5e-5
  weight_decay: 1.0e-2
  batch_size: 8
  grad_accum: 2
  max_epochs: 40
  warmup_epochs: 1
  patience: 8
  grad_clip: 5.0
  amp: true
  num_workers: 8
  select_metric: cer
decode: {method: greedy}
