# generated by scripts/flix_v6_run.sh from configs/flix_v5 from configs/flix_v4
# Flix v4 fusion v3, warm start (fusion_gated_ws). It has the same symmetric reliability-gated
# fusion as fusion_gated.yaml. The audio stream is the audio-only twin's full frozen path, up to
# its CTC head. The gate starts 95 % open to audio (bias 3, weights 0), the one new Transformer
# layer starts as the identity, and fused_head is copied from the twin. So the model starts as
# the twin and learns where the lips help. Aim: close fusion_gated's ~1-point clean-audio gap
# and keep its noise gains.
experiment: flix_v6_fusion_gated_ws
seed: 1
data:
  manifest: data/flix_v5/train_mix.csv
  splits: data/flix_v5/splits.csv
  noise_splits: Data/Noise_splits/splits.csv
  tokenizer: subword
  interference:            # Flix v6: audio that does not belong to the face (GridDataset)
    p_silent: 0.10
    p_replace: 0.10
    p_talkover: 0.15
    sir_db: [-5.0, 10.0]
  val_conditions: [silent, replace]
  val_manifests:
    film: data/flix_v5/film_val.csv
    ted: data/flix_v5/ted_val.csv
  visual_augment: true
  visual_aug:
    max_jitter: 4
    p_flip: 0.5
    max_scale: 0.1
    p_erase: 0.3
    max_erase_area: 0.15
    time_masks: 2
    max_mask_width: 6
  train_snrs:
  - clean
  - 10
  - 5
  - 0
  - -5
  - -10
  eval_snrs:
  - clean
  - 0
  - -5
  - -10
model:
  name: v4_fusion_gated
  dropout: 0.2
  num_heads: 8
  fusion_layers: 1
  audio_encoder_cfg:
    name: microsoft/wavlm-base-plus
    cache_dir: pretrained/hf/hub
    mask_time_prob: 0.05
    layerdrop: 0.0
    freeze_feature_encoder: true
  visual_encoder_cfg:
    pretrained: false
    dropout: 0.1
    zoom: 1.0
  modality_dropout:
    audio: 0.15
    visual: 0.15
  aux_ctc:
    audio: 0.0
    visual: 0.0
  freeze:
  - audio_encoder
  - audio_pool
  - audio_head
  - visual_encoder
  - visual_head
  - twin_mlp
  - twin_encoder
  init_streams_from:
    audio: runs/flix_v5/flix_v5_fusion_wp_audio_20261116-000004/best.pt
    visual: runs/flix_v5/flix_v5_fusion_wp_20261116-013318/best.pt
  audio_feature: twin
  twin_layers: 2
  twin_heads: 8
  gate_bias: 3.0
train:
  optimiser: adamw
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 2
  max_epochs: 12
  warmup_epochs: 1
  patience: 4
  grad_clip: 5.0
  amp: true
  num_workers: 8
  select_metric: wer
  lr_mult:
    fused_head: 0.1
decode:
  method: greedy
