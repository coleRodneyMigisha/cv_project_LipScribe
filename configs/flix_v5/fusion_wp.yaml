# generated by scripts/flix_v5_run.sh from configs/flix_v4
# Flix v4 fusion v2 (v4_fusion_wp): both streams on Auto-AVSR word pieces at 25 frames/s,
# lip-anchored residual fusion (starts as visual_c), auxiliary per-stream CTC, frozen audio
# encoder, noise-heavy training and checkpoint selection that includes -5 dB.
# Goal: the lips must *help*, i.e. beat the audio-only twin (fusion_wp_audio.yaml) in noise.
experiment: flix_v5_fusion_wp
seed: 1
data:
  manifest: data/flix_v5/train_mix.csv
  splits: data/flix_v5/splits.csv
  noise_splits: Data/Noise_splits/splits.csv
  tokenizer: subword
  val_manifests: {film: data/flix_v5/film_val.csv, ted: data/flix_v5/ted_val.csv}
  visual_augment: true
  visual_aug: {max_jitter: 4, p_flip: 0.5, max_scale: 0.1, p_erase: 0.3, max_erase_area: 0.15,
               time_masks: 2, max_mask_width: 6}
  # sampled uniformly from this list, so repeats weight the low SNRs (2/9 clean-ish, 6/9 <= 0 dB)
  train_snrs: [clean, 10, 5, 0, 0, -5, -5, -10, -10]
  eval_snrs: [clean, 0, -5]
model:
  name: v4_fusion_wp
  dropout: 0.1
  num_heads: 8
  fusion_layers: 2
  modality_dropout: {audio: 0.3, visual: 0.1}
  aux_ctc: {audio: 0.3, visual: 0.3}
  freeze: [audio_encoder]
  audio_encoder_cfg: {name: microsoft/wavlm-base-plus, cache_dir: pretrained/hf/hub,
                      mask_time_prob: 0.05, layerdrop: 0.0, freeze_feature_encoder: true}
  visual_encoder_cfg: {pretrained: false, dropout: 0.1, zoom: 1.0}
  init_from:
    audio_encoder: runs/flix_v4/flix_v4_audio_reg_20261113-212724/best.pt
    visual_encoder: runs/flix_v5/flix_v5_visual_c_20261115-201956/best.pt
  init_heads_from: runs/flix_v5/flix_v5_visual_c_20261115-201956/best.pt
train:
  optimiser: adamw
  lr: 3.0e-4
  lr_mult: {visual_encoder: 0.1}
  weight_decay: 1.0e-2
  batch_size: 8
  grad_accum: 2
  max_epochs: 12
  warmup_epochs: 1
  patience: 4
  grad_clip: 5.0
  amp: true
  num_workers: 8
  select_metric: wer
decode: {method: greedy}
