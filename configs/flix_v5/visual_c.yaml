# generated by scripts/flix_v5_run.sh from configs/flix_v4
# Flix v4 stage 2 (re-cropped): Auto-AVSR fine-tuned on the Auto-AVSR-style mouth crops of
# scripts/flix_recrop.py (data/flix_v4c, no zoom; the pipeline's mkcfg sets both), keeping its own
# word-piece CTC layer (head: avsr_ctc, 5,049 unigram pieces) instead of a new 28-character one.
# Zero-shot on 142 TED-val clips this starts at 45 % WER (old crops at zoom 0.7: 58 %).
experiment: flix_v5_visual_c
seed: 1
data:
  manifest: data/flix_v5/train_mix.csv
  splits: data/flix_v5/splits.csv
  noise_splits: Data/Noise_splits/splits.csv
  val_manifests: {film: data/flix_v5/film_val.csv, ted: data/flix_v5/ted_val.csv}
  tokenizer: subword          # targets in Auto-AVSR's word pieces (lipscribe.data.subword)
  visual_augment: true
  visual_aug: {max_jitter: 4, p_flip: 0.5, max_scale: 0.1, p_erase: 0.3, max_erase_area: 0.15,
               time_masks: 2, max_mask_width: 6}
  train_snrs: [clean]        # audio is not used by this model
  eval_snrs: [clean]
model:
  name: v4_visual
  head: avsr_ctc
  dropout: 0.1
  visual_encoder_cfg: {checkpoint: pretrained/vsr_trlrs3vox2_base.pth, dropout: 0.1}
train:
  optimiser: adamw
  lr: 1.0e-4                 # CTC head (pretrained now, so lower than visual.yaml's 5e-4)
  lr_mult: {visual_encoder: 0.5}  # pretrained encoder at 5e-5, as in visual.yaml
  weight_decay: 1.0e-2
  batch_size: 8
  grad_accum: 2
  max_epochs: 40
  warmup_epochs: 1
  patience: 8
  grad_clip: 5.0
  amp: true
  num_workers: 8
  select_metric: cer
decode: {method: greedy}
