experiment: b2_visual_only_v2
seed: 1
data:
  manifest: data/manifest.csv
  splits: data/splits.csv
  feature_stats: data/stats/feature_norm.npz
  noise_splits: Data/Noise_splits/splits.csv
  noisy_dir: data/processed/noisy_test
  visual_augment: true
  visual_aug:
    max_jitter: 4
    p_flip: 0.5
    max_scale: 0.1
    p_erase: 0.5
    max_erase_area: 0.15
    time_masks: 2
    max_mask_width: 6
  train_snrs:
  - clean
  - 10
  - 5
  - 0
  - -5
  val_snrs:
  - clean
  eval_snrs:
  - clean
  - 10
  - 5
  - 0
  - -5
model:
  name: b2_visual_only
  streams:
  - visual
  visual_encoder: resnet18_bilstm
  input_norm: clip
  spatial_dropout: 0.2
  fusion: none
  dropout: 0.3
train:
  optimiser: adamw
  lr: 0.001
  weight_decay: 0.01
  batch_size: 16
  grad_accum: 1
  max_epochs: 60
  warmup_epochs: 3
  patience: 20
  grad_clip: 5.0
  amp: true
  num_workers: 8
  time_budget_min: 50.0
decode:
  method: greedy
