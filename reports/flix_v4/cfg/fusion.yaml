experiment: flix_v4_fusion
seed: 1
data:
  manifest: data/flix_v4c/train_mix.csv
  splits: data/flix_v4c/splits.csv
  noise_splits: Data/Noise_splits/splits.csv
  val_manifests:
    film: data/flix_v4c/film_val.csv
    ted: data/flix_v4c/ted_val.csv
  visual_augment: true
  visual_aug:
    max_jitter: 4
    p_flip: 0.5
    max_scale: 0.1
    p_erase: 0.3
    max_erase_area: 0.15
    time_masks: 2
    max_mask_width: 6
  train_snrs:
  - clean
  - 10
  - 5
  - 0
  - -5
  eval_snrs:
  - clean
  - 0
model:
  name: v4_fusion
  dropout: 0.1
  attn_dropout: 0.1
  num_heads: 4
  embed_dim: 256
  modality_dropout:
    audio: 0.25
    visual: 0.15
  audio_encoder_cfg:
    name: microsoft/wavlm-base-plus
    cache_dir: pretrained/hf/hub
    mask_time_prob: 0.05
    layerdrop: 0.05
    freeze_feature_encoder: true
  visual_encoder_cfg:
    pretrained: false
    dropout: 0.1
    zoom: 1.0
  init_from:
    audio_encoder: runs/flix_v4/flix_v4_audio_reg_20261113-212724/best.pt
    visual_encoder: runs/flix_v4/flix_v4_visual_c_20261113-233839/best.pt
train:
  optimiser: adamw
  lr: 0.0003
  lr_mult:
    audio_encoder: 0.1
    visual_encoder: 0.1
  weight_decay: 0.01
  batch_size: 8
  grad_accum: 2
  max_epochs: 20
  warmup_epochs: 1
  patience: 5
  grad_clip: 5.0
  amp: true
  num_workers: 8
  select_metric: wer
decode:
  method: greedy
